name: Build APK (Smart Log Mode)
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = RPM Meter
          package.name = rpmmeter
          package.domain = org.test
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 0.1
          requirements = python3,kivy==2.2.1
          orientation = portrait
          fullscreen = 0
          android.permissions = RECORD_AUDIO
          
          android.minapi = 24
          android.api = 31
          android.sdk = 31
          android.build_tools_version = 33.0.2
          android.ndk = 25b
          android.accept_sdk_license = True
          android.archs = arm64-v8a, armeabi-v7a

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

          unset ANDROID_NDK_ROOT
          unset ANDROID_HOME
          unset ANDROID_SDK_ROOT

          set +e
          buildozer -v android debug > build.log 2>&1
          BUILD_EXIT=$?
          set -e

          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== REAL BUILD ERROR (FILTERED): ==="
            # Ищем строки с ошибками или исключаем блок системных переменных
            grep -i -C 5 "error" build.log || tail -n 120 build.log | head -n 80
            exit 1
          else
            echo "=== BUILD SUCCESSFUL ==="
          fi
          
