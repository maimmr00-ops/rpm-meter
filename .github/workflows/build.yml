name: Build Android APK

on:
  push:
    branches: [ "main", "master", "основной" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev libtool automake autoconf gettext pkg-config openjdk-17-jdk unzip zip wget
        pip install --upgrade "buildozer==1.5.0" "cython==0.29.33"

    - name: Create buildozer.spec and Build (Silent Mode)
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = RPM Meter
        package.name = rpmmeter
        package.domain = org.test
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas
        version = 0.1
        requirements = python3,kivy==2.2.1
        orientation = portrait
        fullscreen = 0
        android.permissions = RECORD_AUDIO
        
        android.minapi = 24
        android.api = 31
        android.sdk = 31
        android.build_tools_version = 33.0.2
        android.ndk = 25b
        android.accept_sdk_license = True
        android.archs = arm64-v8a, armeabi-v7a

        [buildozer]
        log_level = 1
        warn_on_root = 1
        EOF

        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$SDK_DIR/tools/bin"
        mkdir -p "$SDK_DIR/cmdline-tools/latest"
        
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
        unzip -q cmdline.zip -d temp_cmdline
        cp -r temp_cmdline/cmdline-tools/* "$SDK_DIR/cmdline-tools/latest/"
        rm -rf cmdline.zip temp_cmdline

        ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"

        mkdir -p "$SDK_DIR/licenses"
        printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n24333f8a43b682ff24c5b040d1f476906a58390b\nd56f5187479451eabf01fb78af6dfcb131a648b0" > "$SDK_DIR/licenses/android-sdk-license"

        yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" "build-tools;33.0.2" "platforms;android-31" || true

        # Абсолютно тихий режим: вообще не пишем в терминал во время сборки
        echo "Starting silent buildozer compilation..."
        if ! buildozer android debug > build.log 2>&1; then
          echo "=== BUILD FAILED. LAST 30 LINES: ==="
          tail -n 30 build.log
          exit 1
        else
          echo "=== BUILD SUCCESSFUL ==="
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
        
