name: Build Android APK

on:
  push:
    branches: [ "main", "master", "основной" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev libtool automake autoconf gettext pkg-config openjdk-17-jdk unzip zip wget
        pip install --upgrade "buildozer==1.5.0" "cython==0.29.33"

    - name: Create buildozer.spec and Build
      run: |
        cat << 'EOF' > buildozer.spec
        [app]
        title = RPM Meter
        package.name = rpmmeter
        package.domain = org.test
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas
        version = 0.1
        requirements = python3,kivy==2.2.1,numpy
        orientation = portrait
        fullscreen = 0
        android.permissions = RECORD_AUDIO
        
        [app:android]
        android.api = 33
        android.minapi = 24
        android.sdk = 33
        android.build_tools_version = 33.0.2
        android.ndk = 25b
        android.accept_sdk_license = True
        android.archs = arm64-v8a, armeabi-v7a

        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

        # Принудительно принимаем лицензии перед сборкой, чтобы Build-Tools 33 установились без сбоев
        mkdir -p $HOME/.buildozer/android/platform/android-sdk
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
