name: Build Android APK

on:
  push:
    branches: [ "main", "master", "основной" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev libtool automake autoconf gettext pkg-config openjdk-17-jdk unzip zip wget
          python3 --version
          pip install --upgrade pip setuptools wheel
          pip install --upgrade "buildozer==1.5.0" "cython==3.0.10"
          pip install --upgrade "git+https://github.com/kivy/python-for-android.git@master"

      - name: Restore Buildozer cache
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Build APK
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = RPM Meter
          package.name = rpmmeter
          package.domain = org.test
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 0.1
          # Явно заменяем python3 на python311, чтобы не тянулся сломанный python 3.14
          requirements = python311,kivy==2.3.0
          orientation = portrait
          fullscreen = 0
          android.permissions = RECORD_AUDIO
          
          android.minapi = 24
          android.api = 31
          android.sdk = 31
          android.build_tools_version = 33.0.2
          android.ndk = 25b
          android.accept_sdk_license = True
          android.archs = arm64-v8a, armeabi-v7a

          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

          unset ANDROID_NDK_ROOT
          unset ANDROID_NDK_HOME
          unset ANDROID_HOME
          unset ANDROID_SDK_ROOT
          unset ANDROID_SDK_HOME

          export PATH="/opt/hostedtoolcache/Python/3.10.21/x64/bin:$PATH"

          # Очищаем старый кэш сборки p4a, чтобы сбросить старые заголовочные файлы
          rm -rf .buildozer/android/platform/build-*

          set +e
          buildozer -v android debug > build.log 2>&1
          BUILD_EXIT=$?
          set -e

          # Сохраняем только последние 150 строк лога для удобства
          tail -n 150 build.log > build_tail.log

          exit $BUILD_EXIT

      - name: Upload Build Log and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-and-apk
          path: |
            build_tail.log
            bin/*.apk
