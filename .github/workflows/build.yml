name: Build Native Android APK

on:
  push:
    branches: [ "main", "master", "основной" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # Настраиваем Java 17, которая требуется для современных Android SDK и Gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Делаем gradle wrapper исполняемым
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Собираем debug-версию APK через стандартный Gradle-скрипт
      - name: Build APK with Gradle
        run: ./gradlew assembleDebug

      # Загружаем готовый нативный APK в артефакты GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          
