name: Build Android APK

on:
  push:
    branches: [ "main", "master", "основной" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev libtool automake autoconf gettext pkg-config openjdk-17-jdk unzip zip wget
        pip install --upgrade "buildozer==1.5.0" "cython==0.29.33"

    - name: Create buildozer.spec and Build
      env:
        APP_ANDROID_MINAPI: "24"
        APP_ANDROID_API: "31"
        APP_ANDROID_NDK: "25b"
      run: |
        # Генерируем чистый конфиг без sed
        cat << 'EOF' > buildozer.spec
        [app]
        title = RPM Meter
        package.name = rpmmeter
        package.domain = org.test
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas
        version = 0.1
        requirements = python3,kivy==2.2.1,numpy
        orientation = portrait
        osx.python_version = 3
        osx.kivy_version = 1.9.1
        fullscreen = 0
        android.permissions = RECORD_AUDIO
        android.api = 31
        android.minapi = 24
        android.ndk = 25b
        android.accept_sdk_license = True
        android.archs = arm64-v8a, armeabi-v7a

        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

        # Подготовка cmdline-tools под Buildozer 1.5.0
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$SDK_DIR/cmdline-tools/latest"
        mkdir -p "$SDK_DIR/tools/bin"
        
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
        unzip -q cmdline.zip
        mv cmdline-tools/* "$SDK_DIR/cmdline-tools/latest/"
        rm -rf cmdline-tools cmdline.zip

        ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"
        yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --licenses || true

        # Принудительно передаем minapi в env
        export ANDROIDMINAPI=24
        buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
